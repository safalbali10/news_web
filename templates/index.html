<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily News</title>

  <style>
    /* ── Reset & base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* ── Top bar ──────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, #1a1f2e, #16213e);
      border-bottom: 2px solid #2d3748;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
    }

    header h1 span { color: #f6ad55; }   /* orange accent */

    #today-date {
      font-size: 0.85rem;
      color: #718096;
      font-weight: 500;
    }

    /* ── Main layout ──────────────────────────────────────── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    /* ── Section headings ─────────────────────────────────── */
    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 2px solid #2d3748;
    }

    .section-title .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Different badge colours per section */
    .badge-hot    { background: #c53030; color: #fff; }
    .badge-sport  { background: #276749; color: #fff; }
    .badge-world  { background: #2b6cb0; color: #fff; }
    .badge-war    { background: #744210; color: #fff; }

    /* ── Headlines strip (horizontal scroll) ─────────────── */
    #headlines-section { margin-bottom: 48px; }

    .headlines-strip {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: thin;
      scrollbar-color: #4a5568 transparent;
    }

    .headline-card {
      flex: 0 0 280px;
      background: linear-gradient(145deg, #1e2535, #1a2030);
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 18px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .headline-card:hover {
      transform: translateY(-3px);
      border-color: #f6ad55;
      box-shadow: 0 8px 24px rgba(246,173,85,0.15);
    }

    .headline-card .source-tag {
      font-size: 0.7rem;
      font-weight: 600;
      color: #f6ad55;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .headline-card h3 {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.45;
      color: #e2e8f0;
      flex: 1;
    }

    .headline-card .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .headline-card .time-tag {
      font-size: 0.7rem;
      color: #718096;
    }

    .expand-hint {
      font-size: 0.68rem;
      color: #4a5568;
      font-style: italic;
    }

    /* Description area inside headline card (hidden by default) */
    .headline-card .description {
      display: none;
      font-size: 0.82rem;
      color: #a0aec0;
      line-height: 1.6;
      border-top: 1px solid #2d3748;
      padding-top: 10px;
      margin-top: 4px;
    }

    .headline-card.expanded .description { display: block; }
    .headline-card.expanded .expand-hint { display: none; }

    .read-more-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #f6ad55;
      text-decoration: none;
    }
    .read-more-link:hover { text-decoration: underline; }

    /* ── Section grids (sports / world / iran) ────────────── */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      margin-bottom: 48px;
    }

    .news-card {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .news-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }

    /* Accent bar colour per section */
    .news-card.sport  { border-top: 3px solid #48bb78; }
    .news-card.world  { border-top: 3px solid #63b3ed; }
    .news-card.war    { border-top: 3px solid #ed8936; }

    .news-card:hover.sport  { border-color: #48bb78; }
    .news-card:hover.world  { border-color: #63b3ed; }
    .news-card:hover.war    { border-color: #ed8936; }

    /* Article thumbnail image */
    .news-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }

    .news-card .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .news-card .source-tag {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #718096;
    }

    .news-card h3 {
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.45;
      color: #e2e8f0;
    }

    .news-card .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .news-card .time-tag  { font-size: 0.7rem; color: #718096; }
    .news-card .expand-hint { font-size: 0.68rem; color: #4a5568; font-style: italic; }

    /* Description area inside grid card (hidden by default) */
    .news-card .description {
      display: none;
      font-size: 0.82rem;
      color: #a0aec0;
      line-height: 1.6;
      border-top: 1px solid #2d3748;
      padding: 14px 16px 16px;
    }

    .news-card.expanded .description  { display: block; }
    .news-card.expanded .expand-hint  { display: none; }

    /* ── Loading spinner ──────────────────────────────────── */
    .loading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #718096;
      font-size: 0.85rem;
      padding: 20px 0;
    }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid #4a5568;
      border-top-color: #f6ad55;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error state ──────────────────────────────────────── */
    .error-msg {
      color: #fc8181;
      font-size: 0.85rem;
      padding: 16px;
      background: #2d1515;
      border-radius: 8px;
      border: 1px solid #c53030;
    }
  </style>
</head>

<body>

  <!-- ── Header ───────────────────────────────────────────── -->
  <header>
    <h1>Daily <span>News</span></h1>
    <span id="today-date"></span>
  </header>

  <!-- ── Main content ─────────────────────────────────────── -->
  <main>

    <!-- Top Headlines strip -->
    <section id="headlines-section">
      <div class="section-title">
        🗞️ Today's Top Headlines
        <span class="badge badge-hot">Live</span>
      </div>
      <div id="headlines-container" class="headlines-strip">
        <div class="loading"><div class="spinner"></div> Loading headlines…</div>
      </div>
    </section>

    <!-- Sports -->
    <section>
      <div class="section-title">
        🏆 Sports
        <span class="badge badge-sport">Sports</span>
      </div>
      <div id="sports-container" class="news-grid">
        <div class="loading"><div class="spinner"></div> Loading sports…</div>
      </div>
    </section>

    <!-- World -->
    <section>
      <div class="section-title">
        🌍 World News
        <span class="badge badge-world">World</span>
      </div>
      <div id="world-container" class="news-grid">
        <div class="loading"><div class="spinner"></div> Loading world news…</div>
      </div>
    </section>

    <!-- US–Iran War Updates -->
    <section>
      <div class="section-title">
        ⚡ US–Iran War Updates
        <span class="badge badge-war">Breaking</span>
      </div>
      <div id="iran-container" class="news-grid">
        <div class="loading"><div class="spinner"></div> Loading updates…</div>
      </div>
    </section>

  </main>

  <script>
    /* ─────────────────────────────────────────────────────────
       News Web App — Frontend JavaScript
       ─────────────────────────────────────────────────────────
       This script:
         1. Shows today's date in the header
         2. Fetches news from the Flask backend (/api/...)
         3. Builds article cards and inserts them into the page
         4. Handles click-to-expand so descriptions only show
            when the user clicks a card
       ───────────────────────────────────────────────────────── */

    // ── 1. Show today's date ──────────────────────────────────
    const dateEl = document.getElementById('today-date');
    dateEl.textContent = new Date().toLocaleDateString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });


    // ── 2. Time formatter ─────────────────────────────────────
    /**
     * Takes an ISO date string from the API and returns a
     * human-friendly string like "3 hours ago" or "May 13".
     */
    function timeAgo(isoString) {
      if (!isoString) return '';
      const diff = Date.now() - new Date(isoString).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 60)  return `${mins}m ago`;
      if (mins < 1440) return `${Math.floor(mins/60)}h ago`;
      return new Date(isoString).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }


    // ── 3. Toggle expand / collapse on click ─────────────────
    /**
     * Attaches a click handler to a card element.
     * First click: adds 'expanded' class → CSS shows .description
     * Second click: removes it → description hides again
     */
    function makeExpandable(card) {
      card.addEventListener('click', () => {
        card.classList.toggle('expanded');
      });
    }


    // ── 4. Build a HEADLINE card (horizontal strip) ───────────
    /**
     * Creates a small horizontal-scroll card for the top
     * headlines section. Shows title + source by default,
     * reveals description on click.
     */
    function buildHeadlineCard(article) {
      const card = document.createElement('div');
      card.className = 'headline-card';

      const source = article.source?.name || 'Unknown';
      const desc   = article.description || 'No description available.';
      const url    = article.url || '#';
      const time   = timeAgo(article.publishedAt);

      card.innerHTML = `
        <div class="source-tag">${escHtml(source)}</div>
        <h3>${escHtml(article.title || 'No title')}</h3>
        <div class="card-footer">
          <span class="time-tag">${time}</span>
          <span class="expand-hint">Click to expand</span>
        </div>
        <div class="description">
          ${escHtml(desc)}
          <br/>
          <a class="read-more-link" href="${url}" target="_blank" rel="noopener">
            Read full article →
          </a>
        </div>
      `;

      makeExpandable(card);
      return card;
    }


    // ── 5. Build a GRID card (sports / world / iran) ──────────
    /**
     * Creates a larger grid card with an optional image.
     * 'type' is 'sport', 'world', or 'war' — used for CSS colour.
     */
    function buildGridCard(article, type) {
      const card = document.createElement('div');
      card.className = `news-card ${type}`;

      const source = article.source?.name || 'Unknown';
      const desc   = article.description || 'No description available.';
      const url    = article.url || '#';
      const time   = timeAgo(article.publishedAt);
      const img    = article.urlToImage;

      card.innerHTML = `
        ${img ? `<img src="${img}" alt="article image" onerror="this.style.display='none'" />` : ''}
        <div class="card-body">
          <div class="source-tag">${escHtml(source)}</div>
          <h3>${escHtml(article.title || 'No title')}</h3>
          <div class="card-footer">
            <span class="time-tag">${time}</span>
            <span class="expand-hint">Click for details</span>
          </div>
        </div>
        <div class="description">
          ${escHtml(desc)}
          <br/>
          <a class="read-more-link" href="${url}" target="_blank" rel="noopener">
            Read full article →
          </a>
        </div>
      `;

      makeExpandable(card);
      return card;
    }


    // ── 6. Escape HTML to prevent XSS ────────────────────────
    /**
     * Converts special characters like < > & into safe HTML
     * entities so user-generated content can't inject scripts.
     */
    function escHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }


    // ── 7. Show error message inside a container ──────────────
    function showError(container, msg) {
      container.innerHTML = `<div class="error-msg">⚠️ ${msg}</div>`;
    }


    // ── 8. Fetch & render each section ────────────────────────
    /**
     * Generic function that:
     *   - calls a backend endpoint (e.g. /api/sports)
     *   - builds cards for each article
     *   - inserts them into the container element
     */
    async function loadSection({ endpoint, containerId, cardType }) {
      const container = document.getElementById(containerId);

      try {
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error(`Server error ${res.status}`);

        const articles = await res.json();

        // Clear the loading spinner
        container.innerHTML = '';

        if (!articles.length) {
          container.innerHTML = '<p style="color:#718096;font-size:.85rem">No articles found.</p>';
          return;
        }

        // Build and append a card for each article
        articles.forEach(article => {
          // Skip articles without a title (API sometimes returns [Removed])
          if (!article.title || article.title.includes('[Removed]')) return;

          let card;
          if (cardType === 'headline') {
            card = buildHeadlineCard(article);
          } else {
            card = buildGridCard(article, cardType);
          }
          container.appendChild(card);
        });

      } catch (err) {
        showError(container, `Could not load news. (${err.message})`);
      }
    }


    // ── 9. Kick everything off ────────────────────────────────
    loadSection({ endpoint: '/api/headlines', containerId: 'headlines-container', cardType: 'headline' });
    loadSection({ endpoint: '/api/sports',   containerId: 'sports-container',   cardType: 'sport'    });
    loadSection({ endpoint: '/api/world',    containerId: 'world-container',    cardType: 'world'    });
    loadSection({ endpoint: '/api/iran',     containerId: 'iran-container',     cardType: 'war'      });
  </script>

</body>
</html>
